name: review-hub

services:
  proxy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

  web:
    build:
      context: ./apps/web
      target: development
    restart: unless-stopped
    environment:
      NODE_ENV: development
    expose:
      - "3000"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next

  api:
    build:
      context: ./apps/api
      target: development
    restart: unless-stopped
    environment:
      REVIEW_HUB_DATABASE_URL: sqlite:////data/review-hub.db
    expose:
      - "8000"
    volumes:
      - ./data:/data
      - ./apps/api:/app
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  web_node_modules:
  web_next:
